[project]
name = "taxifare"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raphael Bompy", email = "rabomp@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "db-dtypes>=1.9.0",
    "fastapi>=0.165.0",
    "gcloud>=0.18.3",
    "google>=3.0.0",
    "google-cloud>=0.34.0",
    "google-cloud-bigquery>=3.47.0",
    "google-cloud-storage>=3.17.2",
    "pandas<3",
    "pillow>=13.0.0",
    "pyarrow>=10.0.1",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
taxifare = "taxifare:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
